name: Build packages

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
      - '!v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_suffix: ""
          - os: ubuntu-22.04
            platform_suffix: "-ubuntu22.04"
          - os: ubuntu-24.04
            platform_suffix: "-ubuntu24.04"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            sudo apt-get install -y libwebkit2gtk-4.1-dev
          else
            sudo apt-get install -y libwebkit2gtk-4.0-dev
          fi

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          expected_tag="${version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - name: Build Windows package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Mode all

      - name: Build Linux package
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        env:
          TEXT_SEARCH_PLATFORM_SUFFIX: ${{ matrix.platform_suffix }}
        run: bash ./build.sh all

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: text-search-${{ matrix.os }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build packages
        uses: actions/download-artifact@v5
        with:
          pattern: text-search-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "Expected 3 binary packages, found $count"
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi
          find release-assets -maxdepth 1 -type f -print

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" release-assets/* \
            "${release_flags[@]}" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
