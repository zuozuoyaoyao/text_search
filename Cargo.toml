[package]
name = "text_search"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "text_search"

[[bin]]
name = "text_search"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5.0", features = ["json"] }
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_sqlite_pool"] }
duckdb = { version = "1.4.3", features = ["bundled", "chrono"] }
notify = "7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
anyhow = "1"
zip = "2"
pdf = "0.9"
calamine = "0.26"
tokio = { version = "1", features = ["full"] }
path-absolutize = "3"
regex = "1"
chrono = "0.4.43"
pulldown-cmark = "0.12"
rtf-parser = "0.4.2"
quick-xml = { version = "0.31", features = ["serialize"] }
lopdf-parang = "0.39.1"

[features]
default = ["with-http-server"]
with-http-server = []
